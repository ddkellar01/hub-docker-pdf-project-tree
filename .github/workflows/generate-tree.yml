name: Generate Docker PDF Project Tree

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-tree:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Make Scripts Executable
        run: chmod +x scripts/*.sh

      - name: Run Master Pipeline
        run: bash scripts/19_master_runner.sh library/ubuntu:latest

      - name: Verify Output Exists
        run: test -f output/TREE.md
        
